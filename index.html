<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Demo JavaScript</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <h1>JavaScript Syntax</h2>
        <h3>The let and const keywords create variables</h3>
        
        <p id="demo"></p>
        
        <script>
            let x = 5;
            const fname = "John";

            document.getElementById("demo").innerHTML = fname + " is " + x + " years old.";
        </script>


    </body>
</html>
